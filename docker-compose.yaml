services:
  redis:
    container_name: redis_
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis_:6379
    ports:
      - "8081:8081"
    user: redis